# CWRU Data Marshal - Full Docker Compose with ALL Clients
#
# This setup runs both marshals AND all clients in Docker containers.
# External clients can still connect via host ports (localhost:8080, localhost:8081).
#
# Prerequisites:
#   1. Create worktrees (sibling directories to this repo):
#      git worktree add ../mri_data_marshal_worktree mri-data-marhsal
#      git worktree add ../robot_data_marshal_worktree robot_data_marshal_with_catheter_system_components
#
#   2. Build and run all:
#      docker compose -f docker-compose.full.yml build
#      docker compose -f docker-compose.full.yml up -d
#
#   3. Run only marshals (no clients):
#      docker compose -f docker-compose.full.yml up -d mri-marshal robot-marshal
#
#   4. Run with specific profile:
#      docker compose -f docker-compose.full.yml --profile mri up -d
#      docker compose -f docker-compose.full.yml --profile robot up -d
#
# Port Access:
#   - localhost:8080 -> MRI Marshal HTTP API
#   - localhost:8081 -> Robot Marshal HTTP API
#   - localhost:8090 -> MRI Marshal WebSocket

services:
  # ==================== MARSHALS (Servers) ====================

  mri-marshal:
    image: cwru/mri-marshal:latest
    container_name: cwru-mri-marshal
    build:
      context: ../mri_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.mri
    ports:
      - "8080:8080"   # HTTP API
      - "8090:8090"   # WebSocket
    volumes:
      - ./data/mri_data:/data/mri_data
    environment:
      - HDF5_USE_FILE_LOCKING=FALSE
      - HDF5_FILE_LOCKING=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - cwru-net

  robot-marshal:
    image: cwru/robot-marshal:latest
    container_name: cwru-robot-marshal
    build:
      context: ../robot_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.robot
    ports:
      - "8081:8081"   # HTTP API
    volumes:
      - ./data/robot_data:/data/robot_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - cwru-net

  # ==================== MRI CLIENTS ====================

  image-streamer:
    image: cwru/image-streamer:latest
    container_name: cwru-image-streamer
    build:
      context: ../mri_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.image-streamer
    command: ["./build/image_streamer", "--http", "http://mri-marshal:8080", "--interval", "0.5", "--size", "64", "--slices", "4"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net
    profiles:
      - mri
      - full

  ecg-client:
    image: cwru/ecg-client:latest
    container_name: cwru-ecg-client
    build:
      context: ../mri_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.ecg-client
    command: ["python3", "ecg_client.py", "--endpoint", "http://mri-marshal:8080", "--count", "0", "--interval", "1.0", "--heart-rate", "72"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net
    profiles:
      - mri
      - full

  pose-client:
    image: cwru/pose-client:latest
    container_name: cwru-pose-client
    build:
      context: ../mri_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.pose-client
    command: ["python3", "pose_client.py", "--endpoint", "http://mri-marshal:8080", "--count", "0", "--interval", "0.5", "--trajectory", "circular"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net
    profiles:
      - mri
      - full

  viz-client:
    image: cwru/viz-client:latest
    container_name: cwru-viz-client
    build:
      context: ../mri_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.viz-client
    command: ["./build/viz_client", "--ws", "ws://mri-marshal:8090/ws"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    environment:
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    restart: unless-stopped
    networks:
      - cwru-net
    profiles:
      - mri-viz
      - full-viz

  # ==================== ROBOT CLIENTS ====================

  catheter-tracking:
    image: cwru/robot-clients:latest
    container_name: cwru-catheter-tracking
    build:
      context: ../robot_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.robot-clients
    command: ["./catheter-tracking"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net
    profiles:
      - robot
      - full

  controller:
    image: cwru/robot-clients:latest
    container_name: cwru-controller
    build:
      context: ../robot_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.robot-clients
    command: ["./controller"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net
    profiles:
      - robot
      - full

  planning:
    image: cwru/robot-clients:latest
    container_name: cwru-planning
    build:
      context: ../robot_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.robot-clients
    command: ["./planning"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net
    profiles:
      - robot
      - full

  front-end:
    image: cwru/robot-clients:latest
    container_name: cwru-front-end
    build:
      context: ../robot_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.robot-clients
    command: ["./front-end"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net
    profiles:
      - robot
      - full

  surface-tracking:
    image: cwru/robot-clients:latest
    container_name: cwru-surface-tracking
    build:
      context: ../robot_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.robot-clients
    command: ["./surface-tracking"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net
    profiles:
      - robot
      - full

networks:
  cwru-net:
    driver: bridge
