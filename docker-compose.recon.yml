# CWRU Data Marshal - Demo with Reconstruction Service
# Extends docker-compose.demo.yml to add reconstruction service support
# Run: docker-compose -f docker-compose.demo.yml -f docker-compose.recon.yml up

services:
  # Reconstruction service (Gadgetron or custom)
  reconstruction-service:
    image: gadgetron/gadgetron:latest  # Or your custom image
    container_name: cwru-reconstruction
    ports:
      - "9002:9002"
    environment:
      - GADGETRON_PORT=9002
      # Add any Gadgetron-specific config here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - cwru-net
    # Optional: mount reconstruction pipelines/configs
    # volumes:
    #   - ./recon-configs:/opt/gadgetron/config:ro

  # MRI Marshal with reconstruction enabled
  mri-marshal:
    command:
      - sh
      - -c
      - |
        SESSION=/session-data/run_$$(date +%Y%m%d_%H%M%S)
        mkdir -p $$SESSION/mrd
        echo "[MRI Marshal] Starting on http://0.0.0.0:8080, ws://0.0.0.0:8090"
        echo "[MRI Marshal] Data dir: $$SESSION"
        echo "[MRI Marshal] Reconstruction: http://reconstruction-service:9002"
        exec /opt/mri/build/marshal \
          --http 0.0.0.0:8080 \
          --ws 0.0.0.0:8090 \
          --data $$SESSION \
          --recon-endpoint http://reconstruction-service:9002
    depends_on:
      reconstruction-service:
        condition: service_healthy

  # K-space data sender (sends raw k-space instead of reconstructed)
  kspace-streamer:
    image: cwru/kspace-streamer:latest  # Custom client that sends raw k-space
    container_name: cwru-kspace-streamer
    command:
      - sh
      - -c
      - |
        echo "[K-Space Streamer] Sending raw k-space to marshal..."
        echo "[K-Space Streamer] Marshal will forward to reconstruction service"
        exec ./build/kspace_streamer \
          --http http://mri-marshal:8080 \
          --dt-ms ${KSPACE_INTERVAL:-100} \
          --samples ${KSPACE_SAMPLES:-256} \
          --channels ${KSPACE_CHANNELS:-32}
    depends_on:
      mri-marshal:
        condition: service_healthy
      reconstruction-service:
        condition: service_healthy
    networks:
      - cwru-net
    profiles:
      - kspace  # Enable with: docker-compose --profile kspace up

networks:
  cwru-net:
    name: cwru-demo-net
    driver: bridge
    attachable: true
