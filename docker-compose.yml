# CWRU Data Marshal - Docker Compose Configuration
#
# This setup uses local worktrees as build contexts.
# Each service builds from its corresponding git worktree.
#
# Prerequisites:
#   1. Create worktrees (sibling directories to this repo):
#      git worktree add ../mri_data_marshal_worktree mri-data-marhsal
#      git worktree add ../robot_data_marshal_worktree robot_data_marshal_with_catheter_system_components
#
#   2. Build and run:
#      docker compose build
#      docker compose up -d
#
# Works in both:
#   - Devcontainer: /workspaces/cwru_data_marshal/
#   - WSL2: ~/research/catheter/cwru_data_marshal/
#
# Data Access:
#   - External clients access marshals via HTTP (localhost:8080, localhost:8081)
#   - Data files are available on host at ./data/mri_data/ and ./data/robot_data/

services:
  mri-marshal:
    image: cwru/mri-marshal:latest
    container_name: cwru-mri-marshal
    build:
      context: ../mri_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.mri
    ports:
      - "8080:8080"   # HTTP API
      - "8090:8090"   # WebSocket
    volumes:
      - ./data/mri_data:/data/mri_data
    environment:
      - HDF5_USE_FILE_LOCKING=FALSE
      - HDF5_FILE_LOCKING=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  robot-marshal:
    image: cwru/robot-marshal:latest
    container_name: cwru-robot-marshal
    build:
      context: ../robot_data_marshal_worktree
      dockerfile: ../cwru_data_marshal/docker/Dockerfile.robot
    ports:
      - "8081:8081"   # HTTP API
    volumes:
      - ./data/robot_data:/data/robot_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/read/robot_status"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
