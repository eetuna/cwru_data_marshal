x-build-dev: &build-dev
  context: ./.devcontainer
  dockerfile: Dockerfile
  target: dev
  args:
    BUILD_ISMRMRD_FROM_SOURCE: "true"
    ISMRMRD_TAG: "main"

x-dev-volumes: &dev-volumes
  - .:/workspaces/cwru_data_marshal
  - ./data:/data

x-build-command: &build-command "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build"

services:
  marshal:
    build: *build-dev
    command: bash -lc "${BUILD_CMD:-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build} && ./build/marshal --http 0.0.0.0:8080 --ws 0.0.0.0:8090 --data /data --sink mrd --flush-max-frames 4 --flush-max-ms 50"
    environment:
      BUILD_CMD: *build-command
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal

  viz:
    build: *build-dev
    command: bash -lc "${BUILD_CMD:-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build} && ./build/viz_client --ws ws://marshal:8090/ws --data /data"
    environment:
      BUILD_CMD: *build-command
    depends_on:
      - marshal
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal

  fk:
    build: *build-dev
    command: bash -lc "${BUILD_CMD:-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build} && ./build/fk_client --http http://marshal:8080 --pretty"
    environment:
      BUILD_CMD: *build-command
    depends_on:
      - marshal
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal

  image_streamer:
    build: *build-dev
    command: bash -lc "${BUILD_CMD:-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build} && ./build/image_streamer --http http://marshal:8080 --stream compose_demo --nx 128 --ny 128 --nslices 8 --dt-ms 500"
    environment:
      BUILD_CMD: *build-command
    depends_on:
      - marshal
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal

  fs_tail:
    build: *build-dev
    command: bash -lc "${BUILD_CMD:-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build} && ./build/fs_tail_client"
    environment:
      BUILD_CMD: *build-command
      DM_INDEX: /data/mrd/index.jsonl
      DM_TAIL_OFFSET: /data/mrd/.fs_tail_offset
    depends_on:
      - marshal
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal
