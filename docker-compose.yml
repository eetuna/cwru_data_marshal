version: '3.3'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: cpp_server
    ports:
      - "8080:8080"
    networks:
      cppnet:
        ipv4_address: 172.28.1.10
  client-a:
    build:
      context: .
      dockerfile: Dockerfile.client-a
    container_name: cpp_client-a
    depends_on:
      - server
    networks:
      cppnet:
        ipv4_address: 172.28.1.11

  client-b:
    build:
      context: .
      dockerfile: Dockerfile.client-b
    container_name: cpp_client-b
    depends_on:
      - server   
    networks:
      cppnet:
        ipv4_address: 172.28.1.12

  client-c:
    build:
      context: .
      dockerfile: Dockerfile.client-c
    container_name: cpp_client-c
    depends_on:
      - server
    networks:
      cppnet:
        ipv4_address: 172.28.1.13
networks:
  cppnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16