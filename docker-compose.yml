services:
  mri-marshal:
    image: cwru/mri-marshal:latest
    container_name: cwru-mri-marshal
    build:
      context: .
      dockerfile: docker/Dockerfile.mri
      args:
        REPO_URL: https://github.com/cwru-mercis/cwru_data_marshal.git
        BRANCH: mri-data-marhsal
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes:
      - ./data/mri_data:/data/mri_data
    environment:
      - HDF5_USE_FILE_LOCKING=FALSE
      - HDF5_FILE_LOCKING=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  robot-marshal:
    image: cwru/robot-marshal:latest
    container_name: cwru-robot-marshal
    build:
      context: .
      dockerfile: docker/Dockerfile.robot
      args:
        REPO_URL: https://github.com/cwru-mercis/cwru_data_marshal.git
        BRANCH: robot_data_marshal_with_catheter_system_components
    ports:
      - "8081:8081"
    volumes:
      - ./data/robot_data:/data/robot_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/read/robot_status"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
