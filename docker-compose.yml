version: '3.3'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - ~/cwru_front_end/log_files/:/log_files/
      - ~/cwru_front_end/files/:/files/
    container_name: cpp_server
    ports:
      - "8080:8080"
    networks:
      cppnet:
        ipv4_address: 172.28.1.10

  client-catheter-tracking:
    build:
      context: .
      dockerfile: Dockerfile.client-catheter-tracking
    container_name: cpp_client-catheter-tracking
    depends_on:
      - server
    environment:
      - ROBOT_MARSHAL_HOST=server
      - ROBOT_MARSHAL_PORT=8081
    networks:
      cppnet:
        ipv4_address: 172.28.1.11

  client-force-sensor:
    build:
      context: .
      dockerfile: Dockerfile.client-force-sensor
    container_name: cpp_client-force-sensor
    depends_on:
      - server
    environment:
      - ROBOT_MARSHAL_HOST=server
      - ROBOT_MARSHAL_PORT=8081
    networks:
      cppnet:
        ipv4_address: 172.28.1.17

  client-front-end:
    build:
      context: .
      dockerfile: Dockerfile.client-front-end
    container_name: cpp_client-front-end
    depends_on:
      - server   
    environment:
      - ROBOT_MARSHAL_HOST=server
      - ROBOT_MARSHAL_PORT=8081
    networks:
      cppnet:
        ipv4_address: 172.28.1.12

  client-surface-tracking:
    build:
      context: .
      dockerfile: Dockerfile.client-surface-tracking
    container_name: cpp_client-surface-tracking
    depends_on:
      - server
    environment:
      - ROBOT_MARSHAL_HOST=server
      - ROBOT_MARSHAL_PORT=8081
    networks:
      cppnet:
        ipv4_address: 172.28.1.13

  client-planning:
    build:
      context: .
      dockerfile: Dockerfile.client-planning
    container_name: cpp_client-planning
    depends_on:
      - server
    environment:
      - ROBOT_MARSHAL_HOST=server
      - ROBOT_MARSHAL_PORT=8081
    networks:
      cppnet:
        ipv4_address: 172.28.1.14

  client-controller:
    build:
      context: .
      dockerfile: Dockerfile.client-controller
    container_name: cpp_client-controller
    depends_on:
      - server
    environment:
      - ROBOT_MARSHAL_HOST=server
      - ROBOT_MARSHAL_PORT=8081
    networks:
      cppnet:
        ipv4_address: 172.28.1.15

  client-webgl:
    build:
      context: .
      dockerfile: Dockerfile.client-webgl
    container_name: cpp_client-webgl
    depends_on:
      - server
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - ROBOT_MARSHAL_HOST=server
      - ROBOT_MARSHAL_PORT=8081
    networks:
      cppnet:
        ipv4_address: 172.28.1.16

networks:
  cppnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16