x-build-dev: &build-dev
  context: ./.devcontainer
  dockerfile: Dockerfile
  target: dev
  args:
    BUILD_ISMRMRD_FROM_SOURCE: "true"
    ISMRMRD_TAG: "main"

x-dev-volumes: &dev-volumes
  - .:/workspaces/cwru_data_marshal
  - ./data:/data

x-build-command: &build-command "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build"

services:
  # MRI Data Marshal (Hardened Hub)
  marshal:
    build: *build-dev
    command: bash -lc "${BUILD_CMD} && ./build/marshal --http 0.0.0.0:8080 --ws 0.0.0.0:8090 --data /data --sink mrd"
    environment:
      BUILD_CMD: *build-command
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal

  # Robot Data Marshal (Specialized RAM Hub)
  robot-marshal:
    build: *build-dev
    command: bash -lc "chmod +x scripts/tools/get_robot_marshal.sh && ./scripts/tools/get_robot_marshal.sh && ./build/robot_marshal_demo 8081"
    ports:
      - "8081:8081"
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal

  # The Safety Bridge (Coordinator)
  coordinator:
    build: *build-dev
    command: bash -lc "python3 -u clients/bridge/coordinator.py"
    environment:
      # Pass internal container addresses to the bridge
      MRI_WS_URI: "ws://marshal:8090/ws"
      MRI_HTTP_BASE: "http://marshal:8080"
      ROBOT_HTTP_BASE: "http://robot-marshal:8081"
    depends_on:
      - marshal
      - robot-marshal
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal

  # Example Visualizer
  viz:
    build: *build-dev
    command: bash -lc "${BUILD_CMD} && ./build/viz_client --ws ws://marshal:8090/ws --data /data"
    environment:
      BUILD_CMD: *build-command
    depends_on:
      - marshal
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal

  # Synthetic Data Generator
  image_streamer:
    build: *build-dev
    command: bash -lc "${BUILD_CMD} && ./build/image_streamer --http http://marshal:8080 --stream compose_demo --frames 0 --dt-ms 500"
    environment:
      BUILD_CMD: *build-command
    depends_on:
      - marshal
    volumes: *dev-volumes
    working_dir: /workspaces/cwru_data_marshal