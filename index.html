<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebGL Demo</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background-color: #1a1a1a;
        font-family: Arial, sans-serif;
        color: white;
      }
      
      .canvas-container {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }

      .canvas-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .canvas-section h2 {
        margin: 0;
        font-size: 16px;
        color: #00ff00;
      }
      
      #glcanvas {
        border: 2px solid #00ff00;
        background-color: black;
        cursor: crosshair;
        flex: 1;
      }

      #canvas2d {
        border: 2px solid #00ff00;
        background-color: black;
        cursor: crosshair;
        width: 512px;
        height: 512px;
      }
      
      #info {
        font-size: 12px;
        color: #aaa;
        line-height: 1.6;
      }
      
      .error {
        color: #ff6b6b;
        padding: 10px;
        border: 1px solid #ff6b6b;
        margin-bottom: 10px;
        border-radius: 4px;
      }
      
      .success {
        color: #51cf66;
        padding: 10px;
        border: 1px solid #51cf66;
        margin-bottom: 10px;
        border-radius: 4px;
      }
    </style>
    <script src="gl-matrix-min.js"></script>
    <script src="webgl-demo.js" type="module"></script>
  </head>

  <body>
    <h1>WebGL Medical Imaging Display</h1>
    <div class="canvas-container">
      <div class="canvas-section">
        <h2>2D Image</h2>
        <canvas id="canvas2d"></canvas>
      </div>
      <div class="canvas-section">
        <h2>3D Volume</h2>
        <canvas id="glcanvas" width="1280" height="960"></canvas>
      </div>
    </div>
    <div id="info">
      <p><strong>Canvas Status:</strong> <span id="status">Initializing...</span></p>
      <p><strong>2D Image (Left):</strong> <span id="status2d">Loading...</span></p>
      <p><strong>3D Volume (Right):</strong> <span id="status3d">Loading...</span></p>
      <p><strong>Debug Info:</strong> <span id="debug"></span></p>
      <p><strong>Selected Point:</strong> <span id="selectedPoint">None</span></p>
      <p><strong>Point Value:</strong> <span id="pointValue">-</span></p>
      <p><strong>World Coordinates:</strong> <span id="worldCoords">-</span></p>
    </div>
  </body>
</html>
