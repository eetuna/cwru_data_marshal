openapi: 3.0.3
info:
  title: CWRU Data Marshal API
  description: >
    A high-performance hub for synchronized MRI and robotic data.
    Supports real-time SWMR frame streaming, physiological waveforms, and robot localization.
  version: 1.0.0
  contact:
    name: Case Western Reserve University

servers:
  - url: http://localhost:8080
    description: Local Dev Server

paths:
  /health:
    get:
      summary: Health Check
      description: Returns the current uptime and server status.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/mrd/frame:
    post:
      summary: Stream MRI Frame
      description: Appends a binary ISMRMRD frame to a growing HDF5 session (SWMR mode).
      parameters:
        - name: X-MRD-Stream
          in: header
          required: true
          schema:
            type: string
          description: Logical identifier for the scan stream.
        - name: X-MRD-Session
          in: header
          required: false
          schema:
            type: string
          description: Optional session grouping token.
      requestBody:
        description: ISMRMRD Image Header + Raw Voxel Bytes
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Frame accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameIngestResponse'

  /v1/mrd/ingest:
    post:
      summary: Bulk MRD Ingest
      description: Upload a complete .mrd file for archival.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: File archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestResponse'

  /v1/bio/signal:
    post:
      summary: Ingest Bio-Signal
      description: Record a high-frequency biological waveform (ECG, Respiration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BioSignalRequest'
      responses:
        '200':
          description: Signal recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardOk'

  /v1/pose/update:
    post:
      summary: Update Pose
      description: Record the latest scanner or robot localization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoseRequest'
      responses:
        '200':
          description: Pose updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardOk'

  /v1/mrd/latest:
    get:
      summary: Get Latest Metadata
      description: Returns metadata for the most recently ingested frame or file.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'
        '204':
          description: No data available yet

  /v1/mrd/since:
    get:
      summary: Query History
      description: Returns all ingest events after a specific timestamp.
      parameters:
        - name: ts
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: ISO-8601 timestamp (exclusive).
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexEntry'

components:
  schemas:
    StandardOk:
      type: object
      properties:
        status: { type: string, example: "ok" }
        data: { type: object }

    HealthResponse:
      type: object
      properties:
        status: { type: string, example: "ok" }
        data:
          type: object
          properties:
            uptime_s: { type: number }

    PoseRequest:
      type: object
      required: [p, R]
      properties:
        p:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
        R:
          type: array
          items: { type: number }
          minItems: 9
          maxItems: 9
        frame: { type: string }
        source: { type: string }

    BioSignalRequest:
      type: object
      required: [ts, source, data, rate_hz]
      properties:
        ts: { type: string, format: date-time }
        source: { type: string, example: "ecg" }
        data:
          type: array
          items: { type: number }
        rate_hz: { type: number }

    IndexEntry:
      type: object
      properties:
        path: { type: string }
        ts: { type: string, format: date-time }
        t_ms: { type: integer }
        type: { type: string, enum: [mrd, acq, bio, pose] }
        seq: { type: integer }

    FrameIngestResponse:
      type: object
      properties:
        status: { type: string, example: "ok" }
        data:
          type: object
          properties:
            stream: { type: string }
            frame_index: { type: integer }
            path: { type: string }
            flushed: { type: boolean }
            ts: { type: string, format: date-time }
            t_ms: { type: integer }

    BulkIngestResponse:
      type: object
      properties:
        status: { type: string, example: "ok" }
        data:
          $ref: '#/components/schemas/IndexEntry'

    MetadataResponse:
      type: object
      properties:
        status: { type: string, example: "ok" }
        data:
          $ref: '#/components/schemas/IndexEntry'
