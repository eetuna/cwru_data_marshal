# Simple Demo - Robot Marshal + All Clients
# Run from robot_data_marshal_worktree directory
#
# Usage:
#   docker compose -f docker-compose.demo.yml build
#   docker compose -f docker-compose.demo.yml up

version: '3.3'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server.demo
    container_name: robot-server
    ports:
      - "8081:8081"
    networks:
      robotnet:
        ipv4_address: 172.28.1.10
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/"]
      interval: 5s
      timeout: 3s
      retries: 5

  client-catheter-tracking:
    build:
      context: .
      dockerfile: Dockerfile.client-catheter-tracking
    container_name: client-catheter-tracking
    depends_on:
      server:
        condition: service_healthy
    environment:
      - ROBOT_MARSHAL_HOST=172.28.1.10
      - ROBOT_MARSHAL_PORT=8081
    networks:
      robotnet:
        ipv4_address: 172.28.1.11

  client-front-end:
    build:
      context: .
      dockerfile: Dockerfile.client-front-end
    container_name: client-front-end
    depends_on:
      server:
        condition: service_healthy
    environment:
      - ROBOT_MARSHAL_HOST=172.28.1.10
      - ROBOT_MARSHAL_PORT=8081
    networks:
      robotnet:
        ipv4_address: 172.28.1.12

  client-surface-tracking:
    build:
      context: .
      dockerfile: Dockerfile.client-surface-tracking
    container_name: client-surface-tracking
    depends_on:
      server:
        condition: service_healthy
    environment:
      - ROBOT_MARSHAL_HOST=172.28.1.10
      - ROBOT_MARSHAL_PORT=8081
    networks:
      robotnet:
        ipv4_address: 172.28.1.13

  client-planning:
    build:
      context: .
      dockerfile: Dockerfile.client-planning
    container_name: client-planning
    depends_on:
      server:
        condition: service_healthy
    environment:
      - ROBOT_MARSHAL_HOST=172.28.1.10
      - ROBOT_MARSHAL_PORT=8081
    networks:
      robotnet:
        ipv4_address: 172.28.1.14

  client-controller:
    build:
      context: .
      dockerfile: Dockerfile.client-controller
    container_name: client-controller
    depends_on:
      server:
        condition: service_healthy
    environment:
      - ROBOT_MARSHAL_HOST=172.28.1.10
      - ROBOT_MARSHAL_PORT=8081
    networks:
      robotnet:
        ipv4_address: 172.28.1.15

networks:
  robotnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16