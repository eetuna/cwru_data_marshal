# CWRU Data Marshal - Demo (Bridge Network)
# Run: ./scripts/demo-docker.sh
# Access: localhost:8080 (MRI Marshal)

services:
  mri-marshal:
    image: cwru/mri-marshal:latest
    container_name: cwru-mri-marshal
    command:
      - /opt/mri/build/marshal
      - --http
      - "0.0.0.0:8080"
      - --mrd-port
      - "9100"
      - --dump-dir
      - /session-data
      - --recon-host
      - mock-recon
      - --recon-port
      - "9002"
    volumes:
      - ${SESSION_DATA_DIR:-./session-data}:/session-data
    ports:
      - "8080:8080"
      - "9100:9100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - cwru-net

  robot-marshal:
    image: cwru/robot-marshal:latest
    container_name: cwru-robot-marshal
    command:
      - sh
      - -c
      - |
        echo "[Robot Marshal] Starting on http://0.0.0.0:8081"
        exec ./server --http 0.0.0.0:8081 >/dev/null 2>&1
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8081/"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - cwru-net

  image-streamer:
    image: cwru/image-streamer:latest
    container_name: cwru-image-streamer
    command: ["./build/image_streamer", "--host", "mri-marshal", "--port", "9100", "--interval", "${IMAGE_INTERVAL}", "--nx", "${IMAGE_WIDTH}", "--ny", "${IMAGE_HEIGHT}", "--nz", "${IMAGE_SLICES}"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  # ecg-client service removed — waveforms (ECG, waveform_id=0) are produced by
  # kspace-streamer with --ecg flag on the same MRD TCP connection as acquisitions,
  # matching how a real scanner sends waveforms (python-ismrmrd-server client.py:264).

  pose-client:
    image: cwru/pose-client:latest
    container_name: cwru-pose-client
    command: ["python3", "-u", "pose_client.py", "--http", "http://mri-marshal:8080", "--count", "0", "--interval", "${POSE_INTERVAL}"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  mock-recon:
    image: cwru/mock-recon:latest
    container_name: cwru-mock-recon
    # MRD TCP server — no healthcheck (TCP probe connections interfere with the protocol)
    ports:
      - "9002:9002"
    networks:
      - cwru-net

  kspace-streamer:
    image: cwru/kspace-streamer:latest
    container_name: cwru-kspace-streamer
    command: ["./build/kspace_streamer", "--host", "mri-marshal", "--port", "9100", "--ecg", "--interval", "${KSPACE_INTERVAL:-0.5}", "--slices", "${KSPACE_SLICES:-5}"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  viz-client:
    image: cwru/viz-client:latest
    container_name: cwru-viz-client
    command: ["./build/viz_client", "--http", "http://mri-marshal:8080"]
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - WAYLAND_DISPLAY=wayland-0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg:rw
      - ${SESSION_DATA_DIR:-./session-data}:/session-data:ro
    depends_on:
      mri-marshal:
        condition: service_healthy
    networks:
      - cwru-net
    profiles:
      - viz

  catheter-tracking:
    image: cwru/robot-clients:latest
    container_name: cwru-catheter-tracking
    command: ["./catheter-tracking"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  controller:
    image: cwru/robot-clients:latest
    container_name: cwru-controller
    command: ["./controller"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  planning:
    image: cwru/robot-clients:latest
    container_name: cwru-planning
    command: ["./planning"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  front-end:
    image: cwru/robot-clients:latest
    container_name: cwru-front-end
    command: ["./front-end"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  surface-tracking:
    image: cwru/robot-clients:latest
    container_name: cwru-surface-tracking
    command: ["./surface-tracking"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  # Run all robot clients with op count summary
  robot-clients:
    image: cwru/robot-clients:latest
    container_name: cwru-robot-clients
    command:
      - sh
      - -c
      - |
        # Start all clients, redirect output to files for counting
        ./catheter-tracking >> /tmp/cath.log 2>&1 &
        ./controller >> /tmp/ctrl.log 2>&1 &
        ./planning >> /tmp/plan.log 2>&1 &
        ./front-end >> /tmp/fe.log 2>&1 &
        ./surface-tracking >> /tmp/surf.log 2>&1 &

        # Monitor and print op counts
        while true; do
          sleep $${MONITOR_INTERVAL:-10}
          CATH=$$(grep -c "CATHETER:" /tmp/cath.log 2>/dev/null || echo 0)
          CTRL=$$(grep -c "CONTROLLER:" /tmp/ctrl.log 2>/dev/null || echo 0)
          PLAN=$$(grep -c "PLANNING:" /tmp/plan.log 2>/dev/null || echo 0)
          FE=$$(grep -c "FRONTEND:" /tmp/fe.log 2>/dev/null || echo 0)
          SURF=$$(grep -c "SURFACE:" /tmp/surf.log 2>/dev/null || echo 0)
          printf "[%s] Robot Clients: cath=%s ctrl=%s plan=%s fe=%s surf=%s\n" "$$(date +%H:%M:%S)" "$$CATH" "$$CTRL" "$$PLAN" "$$FE" "$$SURF"
        done
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
      - MONITOR_INTERVAL=${MONITOR_INTERVAL:-10}
    depends_on:
      robot-marshal:
        condition: service_healthy
    networks:
      - cwru-net
    profiles:
      - robot-clients

networks:
  cwru-net:
    name: cwru-demo-net
    driver: bridge
    attachable: true
