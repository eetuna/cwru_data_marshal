# CWRU Data Marshal - Demo (Bridge Network)
# Run: ./scripts/demo-docker.sh
# Access: localhost:8080 (MRI), localhost:8081 (Robot), localhost:8090 (WebSocket)

services:
  mri-marshal:
    image: cwru/mri-marshal:latest
    container_name: cwru-mri-marshal
    command:
      - sh
      - -c
      - |
        SESSION=/session-data/run_$$(date +%Y%m%d_%H%M%S)
        mkdir -p $$SESSION/mrd
        echo "[MRI Marshal] Starting on http://0.0.0.0:8080, ws://0.0.0.0:8090"
        echo "[MRI Marshal] Data dir: $$SESSION"
        if [ -n "$$RECON_ENDPOINT" ]; then
          echo "[MRI Marshal] Reconstruction endpoint: $$RECON_ENDPOINT"
          exec /opt/mri/build/marshal --http 0.0.0.0:8080 --ws 0.0.0.0:8090 --data $$SESSION --recon-endpoint $$RECON_ENDPOINT
        else
          exec /opt/mri/build/marshal --http 0.0.0.0:8080 --ws 0.0.0.0:8090 --data $$SESSION
        fi
    environment:
      - HDF5_USE_FILE_LOCKING=FALSE
      - RECON_ENDPOINT=${RECON_ENDPOINT:-}
    volumes:
      - ${SESSION_DATA_DIR:-./session-data}:/session-data
    ports:
      - "8080:8080"
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - cwru-net

  robot-marshal:
    image: cwru/robot-marshal:latest
    container_name: cwru-robot-marshal
    command:
      - sh
      - -c
      - |
        echo "[Robot Marshal] Starting on http://0.0.0.0:8081"
        exec ./server --http 0.0.0.0:8081 >/dev/null 2>&1
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8081/"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - cwru-net

  image-streamer:
    image: cwru/image-streamer:latest
    container_name: cwru-image-streamer
    command: ["./build/image_streamer", "--http", "http://mri-marshal:8080", "--dt-ms", "${IMAGE_INTERVAL}", "--width", "${IMAGE_WIDTH}", "--height", "${IMAGE_HEIGHT}", "--slices", "${IMAGE_SLICES}", "--log-stride", "${IMAGE_LOG_STRIDE}"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  ecg-client:
    image: cwru/ecg-client:latest
    container_name: cwru-ecg-client
    command: ["sh", "-c", "sleep 1 && python3 ecg_client.py --endpoint http://mri-marshal:8080 --count 0 --interval ${ECG_INTERVAL} --heart-rate ${ECG_HEART_RATE} --samples 1"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  pose-client:
    image: cwru/pose-client:latest
    container_name: cwru-pose-client
    command: ["python3", "pose_client.py", "--endpoint", "http://mri-marshal:8080", "--count", "0", "--interval", "${POSE_INTERVAL}", "--trajectory", "${POSE_TRAJECTORY}"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  mock-recon:
    image: cwru/mock-recon:latest
    container_name: cwru-mock-recon
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9002/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - cwru-net

  kspace-streamer:
    image: cwru/kspace-streamer:latest
    container_name: cwru-kspace-streamer
    command: ["./build/kspace_streamer", "--http", "http://mri-marshal:8080", "--stream", "raw_scan", "--dt-ms", "${KSPACE_INTERVAL:-100}", "--slices", "${KSPACE_SLICES:-5}"]
    depends_on:
      mri-marshal:
        condition: service_healthy
    networks:
      - cwru-net

  viz-client:
    image: cwru/viz-client:latest
    container_name: cwru-viz-client
    command:
      - sh
      - -c
      - |
        echo "[Viz Client] Waiting for new frame from image-streamer..."
        # Record current frame index
        INITIAL=$$(curl -s http://mri-marshal:8080/v1/mrd/latest | grep -o '"frame_index":[0-9]*' | grep -o '[0-9]*' || echo "-1")
        # Wait for WebSocket notification (blocks until new frame arrives)
        echo '{"subscribe":"mrd"}' | timeout 300 websocat -n1 wss://mri-marshal:8090/ws >/dev/null 2>&1 || true
        echo "[Viz Client] Frame received, starting visualization..."
        exec ./build/viz_client --http http://mri-marshal:8080/v1/mrd/latest
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - WAYLAND_DISPLAY=wayland-0
      - HDF5_USE_FILE_LOCKING=FALSE
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg:rw
      - ${SESSION_DATA_DIR:-./session-data}:/session-data:ro
    depends_on:
      mri-marshal:
        condition: service_healthy
    restart: on-failure
    networks:
      - cwru-net
    profiles:
      - viz

  catheter-tracking:
    image: cwru/robot-clients:latest
    container_name: cwru-catheter-tracking
    command: ["./catheter-tracking"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net

  controller:
    image: cwru/robot-clients:latest
    container_name: cwru-controller
    command: ["./controller"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net

  planning:
    image: cwru/robot-clients:latest
    container_name: cwru-planning
    command: ["./planning"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net

  front-end:
    image: cwru/robot-clients:latest
    container_name: cwru-front-end
    command: ["./front-end"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net

  surface-tracking:
    image: cwru/robot-clients:latest
    container_name: cwru-surface-tracking
    command: ["./surface-tracking"]
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
    depends_on:
      robot-marshal:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cwru-net

  # Run all robot clients with op count summary
  robot-clients:
    image: cwru/robot-clients:latest
    container_name: cwru-robot-clients
    command:
      - sh
      - -c
      - |
        # Start all clients, redirect output to files for counting
        ./catheter-tracking >> /tmp/cath.log 2>&1 &
        ./controller >> /tmp/ctrl.log 2>&1 &
        ./planning >> /tmp/plan.log 2>&1 &
        ./front-end >> /tmp/fe.log 2>&1 &
        ./surface-tracking >> /tmp/surf.log 2>&1 &

        # Monitor and print op counts
        while true; do
          sleep $${MONITOR_INTERVAL:-10}
          CATH=$$(grep -c "CATHETER:" /tmp/cath.log 2>/dev/null || echo 0)
          CTRL=$$(grep -c "CONTROLLER:" /tmp/ctrl.log 2>/dev/null || echo 0)
          PLAN=$$(grep -c "PLANNING:" /tmp/plan.log 2>/dev/null || echo 0)
          FE=$$(grep -c "FRONTEND:" /tmp/fe.log 2>/dev/null || echo 0)
          SURF=$$(grep -c "SURFACE:" /tmp/surf.log 2>/dev/null || echo 0)
          printf "[%s] Robot Clients: cath=%s ctrl=%s plan=%s fe=%s surf=%s\n" "$$(date +%H:%M:%S)" "$$CATH" "$$CTRL" "$$PLAN" "$$FE" "$$SURF"
        done
    environment:
      - ROBOT_MARSHAL_HOST=robot-marshal
      - ROBOT_MARSHAL_PORT=8081
      - MONITOR_INTERVAL=${MONITOR_INTERVAL:-10}
    depends_on:
      robot-marshal:
        condition: service_healthy
    networks:
      - cwru-net
    profiles:
      - robot-clients

networks:
  cwru-net:
    name: cwru-demo-net
    driver: bridge
    attachable: true
